[project]
name = "cu"
version = "0.1.4"
description = "Computer-Use: Windows desktop control for AI agents (daemon + CLI client)"
requires-python = ">=3.11"
dependencies = [
    # base 环境唯一的二进制依赖（DEC-036：不引入 pywin32）
    "windows-capture>=2.0.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cu"]

[tool.ruff]
line-length = 110
# 与 .venv / CI 实际使用的解释器对齐。声明 py311 会把 3.12 才允许的
# f-string 嵌套引号语法判为语法错误，而运行时本来就是 3.12。
target-version = "py312"

[tool.ruff.lint]
# BLE 一并启用：本项目在多个「边界」处刻意捕获宽异常（钩子回调、
# 连接线程、顶层入口），那些地方必须保留 `except Exception` 并写明理由。
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E501"]


[tool.ruff.lint.isort]
# `_daemon_shell` 是单测共用的替身模块，和产品包一样属于「我们自己的代码」——
# 声明成 first-party，isort 才会把它们排在同一组，而不是把测试替身塞进第三方段。
known-first-party = ["cu", "_daemon_shell"]
[tool.ruff.lint.per-file-ignores]
# 真机测试要「把任何异常都记成一条失败并继续跑」，刻意捕获宽异常。
# 逐个加 noqa 只会让那 5 行更难读，而豁免范围限定在这两个文件里。
"tests/native/*.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
