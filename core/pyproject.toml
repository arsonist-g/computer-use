[project]
name = "cu"
version = "0.1.0"
description = "Computer-Use: Windows desktop control for AI agents (daemon + CLI client)"
requires-python = ">=3.11"
dependencies = [
    # base 环境唯一的二进制依赖（DEC-036：不引入 pywin32）
    "windows-capture>=2.0.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cu"]

[tool.ruff]
line-length = 110
# 与 .venv / CI 实际使用的解释器对齐。声明 py311 会把 3.12 才允许的
# f-string 嵌套引号语法判为语法错误，而运行时本来就是 3.12。
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
